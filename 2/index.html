<!DOCTYPE html>

    <style>

        .glitch {

            background-image: url(resources/background.gif);

        canvas {

        }

        #title {
            position: absolute;
            top: 10vh;
            left: 5vw;

            height: 20vh;
        }

        #animatronic {
            position: absolute;
            top: -5vh;
            right: 7vw;
            height: 120vh;
        }

        .loader {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            left: 50%;
            transform: translate(-50%, 0);
            bottom: 12vh;
            z-index: 1;
            color: white;
            font-family: monospace;
            text-align: center;
            font-weight: lighter;
            width: 85vw;
        }

        .loader h1 {
            margin: 0;
            font-size: 5vw;
        }

        .loader hr{
            margin: 0;
            border: white solid 0.1vw;
            width: 0%;
        }

        .loader h2 {
            margin: 1vh 0;
            font-size: 1.4vw;
        }
    </style>
    <script src="../mp/guard-bridge.js?v=8" defer></script>
</head>

<body>
    <canvas id="MMFCanvas" width="1024" height="768"> Your browser does not support Canvas, Please try again.</canvas>
    <div class="selection" id="selection">
        <img id="title" src="resources/title.png">
        <img id="animatronic" src="resources/animatronic.png">
        <div class="loader">
            <h1 id="percentage">0%</h1>
            <hr id="bar">
            <h2 id="stage">STARTING UP...</h2>
        </div>
        <a href="https://discord.gg/xuu8TnSY4b">
            <div class="launcher-text"><img src="resources/launcher-text.png" style="width: 45vw;"></div>
        </a>
    </div>
    <div class="glitch"></div>
    <img src="resources/vignette.png" class="vignette">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</body>
<!--Made by irv77-->
<!-- ANTI-CONGELAMIENTO: el runtime pausa el juego al perder el foco
     (checkFocus → run.pause). En segundo plano o con varias ventanas eso
     congelaba el ARRANQUE (preloader eterno: la subapp del splash se pausa
     y el primer frame nunca llega) y las noches compartidas del MP. Se
     neutralizan los blur ANTES de que el runtime registre sus listeners:
     el juego nunca se pausa sola (como el FNAF original). -->
<script>
    (function () {
        function block(e) { e.stopImmediatePropagation(); }
        window.addEventListener('blur', block, true);
        document.addEventListener('blur', block, true);
    })();
</script>
<!-- ESTABILIZADOR DEL JUEGO (siempre activo, un jugador y multijugador):
     1) ANTI-CONGELAMIENTO: el bucle del juego es una cadena de setTimeout
        que se auto-reprograma AL FINAL del dibujo. Si el render lanza una
        excepción (banco de imágenes del runtime 291 con datos 292: un fondo
        sin decodificar a tiempo → drawImage inválido), la cadena MUERE y el
        juego queda congelado para siempre (era el arranque atascado). Se
        envuelve stepApplication: el tick fallido se salta, pero el bucle
        sigue vivo y el frame se dibuja en cuanto la imagen decodifica.
     2) ANTI-CUSTOM-NIGHT: el frame "customize" (12) se devuelve al menú (13).
        En multijugador el guard-bridge añade su propio watchdog completo. -->
<script>
    (function () {
        let rt = null;
        let appRef = null;
        let _R;
        Object.defineProperty(window, 'Runtime', {
            configurable: true, enumerable: true,
            get: function () { return _R; },
            set: function (v) {
                _R = function () {
                    v.apply(this, arguments);
                    rt = this;
                    stabilize(rt.application);
                    return this;
                };
            }
        });
        function stabilize(a) {
            if (!a || a.__gameStabilized) return;
            a.__gameStabilized = true;
            appRef = a;
            a.__lastStepAt = Date.now();
            // 1) el bucle NUNCA muere por un error de dibujo
            try {
                const orig = a.stepApplication.bind(a);
                a.stepApplication = function () {
                    this.__lastStepAt = Date.now();
                    try {
                        return orig.call(this);
                    } catch (e) {
                        try { console.warn('[stabilizer] tick saltado:', e && e.message); } catch (e2) { }
                        try { this.setUpdate(); } catch (e3) { }   // re-programar el bucle
                        return true;
                    }
                };
                a.__stepWrapped = true;
            } catch (e) { }
            // 2) guardián anti-custom-night
            if (!window.__soloGuard) {
                window.__soloApp = function () { return appRef; };
                window.__soloGuard = setInterval(function () {
                    try {
                        const app = appRef;
                        if (!app || !app.run) return;
                        if (app.currentFrame === 12) {          // "customize" = custom night
                            if (app.appRunningState === 3 && app.run.rhQuit === 0) {
                                app.run.rhQuit = 3;              // LOOPEXIT_GOTOLEVEL
                                app.run.rhQuitParam = (0x8000 | 13);   // → menú
                            } else if (app.appRunningState === 1) {
                                app.nextFrame = 13;
                            }
                        }
                    } catch (e) { }
                }, 250);
            }
        }
        // puente para el guard-bridge (MP): su trap de Runtime reemplaza al
        // de aquí, así que el bridge llama a este hook con la app capturada
        window.__gameStabilize = stabilize;
        // 3) vigilante del bucle: sin ticks durante >1.5s → re-programarlo
        if (!window.__loopVigilante) {
            window.__loopVigilante = setInterval(function () {
                try {
                    const a = appRef;
                    if (!a || !a.__stepWrapped) return;
                    if (Date.now() - (a.__lastStepAt || 0) > 1500) {
                        a.__lastStepAt = Date.now();   // evita ráfagas de kicks
                        try { console.warn('[stabilizer] bucle muerto: re-kick'); } catch (e) { }
                        a.setUpdate();
                    }
                } catch (e) { }
            }, 1000);
        }
    })();
</script>
<script>
    const parts = 20;
    let gametitle, runtimecanvas
    gametitle = document.title;
    runtimecanvas = "resources/FiveNights2NOHACKS.cch";
    // Prevents touchscreen move
    window.addEventListener("scroll", preventMotion, false);
    window.addEventListener("touchmove", preventMotion, false);
    function preventMotion(event) {
        window.scrollTo(0, 0);
        event.preventDefault();
        event.stopPropagation();
    }
    // Fullscreen Key
    const pressedKeys = {};
    document.addEventListener('keydown', event => {
        pressedKeys[event.key] = true;
        if (pressedKeys['-'] && pressedKeys['=']) {
            document.querySelector('canvas').requestFullscreen();
            delete pressedKeys[event.key];
        }
    });
    document.addEventListener('keyup', (event) => {
        delete pressedKeys[event.key];
    });
    // -----------------
    window.onload = function () {
        const map = new Map();

        function updateProgress(text, percent) {
            document.title = percent + '% ' + gametitle
            document.getElementById('percentage').innerHTML = percent + '%';
            document.getElementById('bar').style.width = percent + '%';
            document.getElementById('stage').innerHTML = text;
        }

        async function intercept() {
            const ogfetch = window.fetch;
            window.fetch = async function (input, init) {
                if (typeof input === 'string' && input.startsWith('resources/')) {
                    const fileName = input.split('/').pop();
                    if (map.has(fileName)) {
                        return ogfetch(map.get(fileName), init);
                    }
                }
                return ogfetch(input, init);
            };

            const ogopen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function (method, url) {
                if (url.startsWith('resources/')) {
                    const fileName = url.split('/').pop();
                    if (map.has(fileName)) {
                        url = map.get(fileName);
                    }
                }
                return ogopen.apply(this, arguments);
            };

            const types = [HTMLImageElement, HTMLAudioElement, HTMLVideoElement];
            for (const Tag of types) {
                const descriptor = Object.getOwnPropertyDescriptor(Tag.prototype, 'src');
                if (descriptor && descriptor.set) {
                    Object.defineProperty(Tag.prototype, 'src', {
                        configurable: true,
                        enumerable: true,
                        get: descriptor.get,
                        set: function (val) {
                            if (typeof val === 'string' && val.startsWith('resources/')) {
                                const fileName = val.split('/').pop();
                                if (map.has(fileName)) {
                                    val = map.get(fileName);
                                }
                            }
                            descriptor.set.call(this, val);
                        }
                    });
                }
            }
        }

        async function extract() {
            const res = await fetch("resources.zip");

            const contentLength = res.headers.get("Content-Length");
            const total = parseInt(contentLength, 10);
            const reader = res.body.getReader();
            let loaded = 0;
            const chunks = [];

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                loaded += value.length;
                updateProgress('RETURNING GEARS...', Math.floor((loaded / total / 2) * 100));
            }

            const arrayBuffer = await new Blob(chunks).arrayBuffer();
            const zip = await JSZip.loadAsync(arrayBuffer);
            const files = Object.keys(zip.files).filter(name => !zip.files[name].dir);
            const totalFiles = files.length;

            for (let i = 0; i < totalFiles; i++) {
                const file = zip.files[files[i]];
                const blob = await file.async("blob");
                const url = URL.createObjectURL(blob);
                map.set(files[i], url);
                updateProgress('BOOTING UP ARCHIVE...', Math.floor(((i + 1) / totalFiles / 2) * 100 + 50));
            }
        }

        async function wedone() {
            await extract();
            await intercept();

            const script = document.createElement('script');
            script.src = 'src/Runtime.js';
            script.onload = () => {
                new Runtime("MMFCanvas", runtimecanvas);
            };
            document.getElementById('MMFCanvas').style.display = 'block';
            document.getElementById('selection').style.display = 'none';
            document.title = gametitle;
            document.head.appendChild(script);
        }

        const originalFetch = window.fetch;

        function mergeFiles(fileParts) {
            return new Promise((resolve, reject) => {
                let buffers = [];
                let totalSize = 0;
                let loadedSize = 0;
                Promise.all(fileParts.map(part =>
                    fetch(part, { method: 'HEAD' }).then(res => {
                        try {
                            if (!res.ok) throw new Error("Missing part: " + part);
                            return parseInt(res.headers.get("Content-Length") || "0", 10);
                        } catch (error) { document.getElementById('stage').innerHTML = "ERROR: MISSING FILE(S)..." }
                    })
                )).then(sizes => {
                    totalSize = sizes.reduce((a, b) => a + b, 0);
                    function fetchPart(index) {
                        if (index >= fileParts.length) {
                            let mergedBlob = new Blob(buffers);
                            let mergedFileUrl = URL.createObjectURL(mergedBlob);
                            resolve(mergedFileUrl);
                            return;
                        }

                        fetch(fileParts[index]).then((response) => {
                            if (!response.ok) throw new Error("Missing part: " + fileParts[index]);
                            return response.arrayBuffer();
                        }).then((data) => {
                            buffers.push(data);
                            loadedSize += data.byteLength;
                            updateProgress('LOCATING ARCHIVE...', Math.floor((loadedSize / totalSize / 2) * 100));
                            fetchPart(index + 1);
                        }).catch(reject);
                    }

                    fetchPart(0);
                }).catch(reject);
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }
        Promise.all([
            mergeFiles(getParts("src/resources.zip", 1, parts))
        ]).then(([resources]) => {
            window.fetch = async function (url, ...args) {
                if (url.endsWith("resources.zip")) {
                    return originalFetch(resources, ...args);
                } else {
                    return originalFetch(url, ...args);
                }
            };
            wedone();
        });
    };
</script>
</html>
